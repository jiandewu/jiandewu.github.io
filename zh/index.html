<main class="wrap">
  <header class="masthead">
    <img class="banner" id="banner" src="photos/banner-summer.webp" alt="" width="1600" height="320">
    <div class="masthead-text">
      <h1 id="greeting">你好 ☕</h1>
      <p id="today"></p>
    </div>
  </header>
  <p class="intro">这里放着我每天会翻一翻的两份小报，都会自己更新。泡杯咖啡，随便看看。</p>

  <section>
    <div class="cards">
      <div class="card c-orange">
        <h3><a href="../ai-frontier-digest/">🤖 AI 前沿导读</a></h3>
        <p>AI 圈今天又发生了什么？挑出最值得一读的几条，用大白话讲清楚。</p>
        <ol class="latest" id="ai-latest" hidden></ol>
        <span class="tag">每天更新</span>
      </div>
      <div class="card c-teal">
        <h3><a href="../us-market/">📈 美股公告与要闻</a></h3>
        <p>美股今天的大新闻、宏观数据，还有大公司刚发的公告，一页看完。</p>
        <ol class="latest" id="market-latest" hidden></ol>
        <span class="tag">每天更新</span>
      </div>
    </div>
  </section>

  <section id="numbers" hidden>
    <h2>📊 最近的几个数</h2>
    <div class="stats" id="stats"></div>
    <p class="more">数据来自 FRED，通常晚一两天发布，房贷利率每周一更；方块里是各项的数据日期，箭头对比上一期。</p>
  </section>

  <section id="photos">
    <h2>📷 随手拍</h2>
    <div class="photos">
      <figure><a href="photos/spring-lawn.webp"><img src="photos/spring-lawn-thumb.webp" alt="春天的草坪" width="600" height="338" loading="lazy"></a>
        <figcaption>春天的草坪 · 2022-03</figcaption></figure>
      <figure><a href="photos/summer-beach.webp"><img src="photos/summer-beach-thumb.webp" alt="海边的傍晚" width="600" height="360" loading="lazy"></a>
        <figcaption>海边的傍晚 · 2016-06</figcaption></figure>
      <figure><a href="photos/summer-sunset.webp"><img src="photos/summer-sunset-thumb.webp" alt="树影里的日落" width="512" height="384" loading="lazy"></a>
        <figcaption>树影里的日落 · 2008-06</figcaption></figure>
      <figure><a href="photos/summer-fishing.webp"><img src="photos/summer-fishing-thumb.webp" alt="海边钓鱼" width="600" height="450" loading="lazy"></a>
        <figcaption>海边钓鱼 · 2008-06</figcaption></figure>
      <figure><a href="photos/summer-lake.webp"><img src="photos/summer-lake-thumb.webp" alt="湖边" width="600" height="450" loading="lazy"></a>
        <figcaption>湖边 · 2023-08</figcaption></figure>
      <figure><a href="photos/autumn-path-1.webp"><img src="photos/autumn-path-1-thumb.webp" alt="落叶小路" width="288" height="512" loading="lazy"></a>
        <figcaption>落叶小路 · 2024-10</figcaption></figure>
      <figure><a href="photos/winter-snow.webp"><img src="photos/winter-snow-thumb.webp" alt="雪后" width="600" height="338" loading="lazy"></a>

<dialog id="lightbox" aria-label="照片">
  <img alt="">
  <p></p>
</dialog>

<script>
  // Greet by the visitor's local time; the static text stays as the fallback.
  (function () {
    var h = new Date().getHours();
    var g = h < 5 ? "夜深了 🌙" : h < 11 ? "早上好 ☀️" : h < 13 ? "中午好 🍜" : h < 18 ? "下午好 ☕" : "晚上好 🌙";
    document.getElementById("greeting").textContent = g;
  })();

  // Date, solar term, and a banner for the season, all from the visitor's local date.
  (function () {
    var now = new Date(), m = now.getMonth() + 1, d = now.getDate();
    var season = m >= 3 && m <= 5 ? "spring" : m >= 6 && m <= 8 ? "summer" : m >= 9 && m <= 11 ? "autumn" : "winter";
    document.getElementById("banner").src = "photos/banner-" + season + ".webp";
    // Usual Gregorian dates of the 24 solar terms; actual dates move by a day between years.
    var terms = [[1, 5, "小寒"], [1, 20, "大寒"], [2, 4, "立春"], [2, 19, "雨水"], [3, 5, "惊蛰"], [3, 20, "春分"],
      [4, 4, "清明"], [4, 20, "谷雨"], [5, 5, "立夏"], [5, 21, "小满"], [6, 5, "芒种"], [6, 21, "夏至"],
      [7, 7, "小暑"], [7, 22, "大暑"], [8, 7, "立秋"], [8, 23, "处暑"], [9, 7, "白露"], [9, 23, "秋分"],
      [10, 8, "寒露"], [10, 23, "霜降"], [11, 7, "立冬"], [11, 22, "小雪"], [12, 7, "大雪"], [12, 21, "冬至"]];
    var today = new Date(now.getFullYear(), m - 1, d), term = "";
    for (var i = 0; i < terms.length; i++) {
      var t = terms[i], date = new Date(now.getFullYear(), t[0] - 1, t[1]);
      var days = Math.round((date - today) / 86400000);
      if (days === 0) { term = "今天" + t[2]; break; }
      if (days === 1) { term = "明天" + t[2]; break; }
      if (days > 1 && days <= 7) { term = days + " 天后" + t[2]; break; }
      if (days < 0) term = t[2] + "时节";
    }
    if (!term) term = "冬至时节";
    var week = "日一二三四五六".charAt(now.getDay());
    document.getElementById("today").textContent = m + "月" + d + "日 周" + week + " · " + term;
  })();

  // Photo wall: open the full-size image in a dialog; without JavaScript the link opens the image.
  (function () {
    var box = document.getElementById("lightbox"), img = box.querySelector("img"), cap = box.querySelector("p");
    document.querySelectorAll(".photos a").forEach(function (a) {
      a.addEventListener("click", function (event) {
        event.preventDefault();
        img.src = a.href;
        img.alt = a.querySelector("img").alt;
        cap.textContent = a.parentNode.querySelector("figcaption").textContent;
        box.showModal();
      });
    });
    box.addEventListener("click", function () { box.close(); });
  })();

  // Fill the cards from the two sites; on any failure the cards keep their static text.
  function fillList(id, rows) {
    var list = document.getElementById(id);
    rows.forEach(function (row) {
      var li = document.createElement("li"), a = document.createElement("a");
      a.href = row.url;
      a.textContent = row.title;
      li.appendChild(a);
      if (row.impact) {
        var chip = document.createElement("span");
        chip.className = "impact impact-" + ({"利好": "up", "利空": "down"}[row.impact] || "flat");
        chip.textContent = row.impact;
        li.appendChild(chip);
      }
      list.appendChild(li);
    });
    if (rows.length) list.hidden = false;
  }

  fetch("../ai-frontier-digest/feed.xml").then(function (r) { return r.text(); }).then(function (text) {
    var items = new DOMParser().parseFromString(text, "application/xml").querySelectorAll("item");
    fillList("ai-latest", Array.prototype.slice.call(items, 0, 3).map(function (item) {
      return {title: item.querySelector("title").textContent, url: item.querySelector("link").textContent};
    }));
  }).catch(function () {});

  fetch("../us-market/latest.json").then(function (r) { return r.json(); }).then(function (data) {
    fillList("market-latest", data.items.map(function (item) {
      return {title: item.title, url: "../us-market/" + item.url, impact: item.impact};
    }));
    var stats = document.getElementById("stats");
    data.macro.forEach(function (m) {
      var tile = document.createElement("div"), name = document.createElement("div"),
          value = document.createElement("div"), note = document.createElement("div");
      tile.className = "stat";
      name.className = "stat-name";
      name.textContent = m.name;
      value.className = "stat-value";
      value.textContent = (m.unit === "$" ? "$" : "") + m.value + (m.unit === "%" ? "%" : "");
      note.className = "stat-note";
      var diff = m.previous === null ? 0 : m.value - m.previous;
      if (diff) {
        var arrow = document.createElement("span");
        arrow.className = diff > 0 ? "rise" : "fall";
        arrow.textContent = (diff > 0 ? "▲ " : "▼ ") + Math.abs(diff).toFixed(2);
        note.appendChild(arrow);
        note.appendChild(document.createTextNode(" · "));
      }
      note.appendChild(document.createTextNode(m.date.slice(5)));
      tile.append(name, value, note);
      stats.appendChild(tile);
    });
    if (data.macro.length) document.getElementById("numbers").hidden = false;
  }).catch(function () {});
</script>
<script data-goatcounter="https://jiande.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
</body>
